name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: write
  id-token: write

env:
  REGION: asia-northeast3
  REPOSITORY: notiflex
  IMAGE: api

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:sha-${GITHUB_SHA::7}"
          docker build -t "$IMAGE_URI" app/
          docker push "$IMAGE_URI"
          echo "Pushed $IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Update manifest and push
        run: |
          echo "IMAGE_URI=$IMAGE_URI"
          if [ -z "$IMAGE_URI" ]; then
            echo "IMAGE_URI is empty, aborting" >&2
            exit 1
          fi
          sed -i "s|image: .*|image: ${IMAGE_URI}|" k8s/smb/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/smb/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "ci: deploy notiflex-api:sha-${GITHUB_SHA::7}"
          git push origin main
