apiVersion: batch/v1
kind: CronJob
metadata:
  name: notiflex-healthcheck
  namespace: notiflex
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            cloud.google.com/gke-nodepool: ops-pool
          restartPolicy: OnFailure
          containers:
          - name: healthcheck
            image: curlimages/curl:latest
            command:
            - sh
            - -c
            - |
              echo "Checking notiflex-api health..."
              curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://notiflex-api.notiflex.svc.cluster.local/health
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 50m
                memory: 32Mi
