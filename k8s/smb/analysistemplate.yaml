# canary 트래픽(job="notiflex-api-preview")의 5xx 비율을 Prometheus에 질의해
# 기준을 넘으면 AnalysisRun을 Failed로 만들고, Rollout이 해당 canary 단계를
# 자동으로 abort하도록 한다.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: notiflex-error-rate
  namespace: notiflex
spec:
  args:
    - name: service-name
  metrics:
    - name: error-rate
      interval: 15s
      count: 3
      failureLimit: 0
      consecutiveErrorLimit: 8
      successCondition: result[0] <= 0.05
      provider:
        prometheus:
          address: http://kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090
          query: |
            (sum(increase(http_requests_total{job="{{args.service-name}}", status=~"5.."}[2m])) or vector(0))
            /
            (sum(increase(http_requests_total{job="{{args.service-name}}"}[2m])) or vector(1))
